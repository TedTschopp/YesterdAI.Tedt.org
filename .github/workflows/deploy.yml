name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: pip install -r requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.9'
          bundler-cache: true
      - name: Verify editorial rules and pipeline behavior
        run: |
          python -m unittest discover -s tests
          python scripts/publish.py validate
      - name: Build the static publication
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter
      - name: Index article content for static search
        run: npm run index
      - name: Check pages and feeds
        run: |
          python scripts/check_site.py
          npm run test:smoke
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Build the frozen design fixtures
        run: python scripts/build_fixtures.py
      - name: Verify reader jobs, accessibility, and responsive behavior
        run: npx playwright test tests/browser/reader.spec.js
      - name: Measure candidate mobile performance
        id: performance
        if: github.event_name == 'pull_request'
        run: node scripts/performance.mjs --local
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: candidate-performance
          path: test-results/performance.json
          if-no-files-found: ignore
      - name: Compare approved visual baselines
        if: success() || (failure() && steps.performance.outcome == 'failure')
        shell: bash
        run: |
          set -euo pipefail
          count=$(python -c "from pathlib import Path; print(len(list(Path('tests/browser/__screenshots__').glob('*.png'))))")
          if [ "$count" -lt 48 ]; then
            npm run test:visual:update
            echo '::error::Initial visual candidates require review and an explicit commit before deployment.'
            exit 1
          fi
          npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/browser/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baseline-candidates
          path: tests/browser/__screenshots__/
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
