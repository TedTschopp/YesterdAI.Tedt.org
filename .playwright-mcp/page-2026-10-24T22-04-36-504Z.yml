            - paragraph [ref=e102]: Glyphh has launched Ada, a decision model designed to replicate past business decisions by learning from historical data rather than generating new reasoning each time like traditional language models. Ada can handle routine decisions independently and escalate uncertain cases to language models, reducing costs and improving consistency. Ada has been benchmarked on tasks such as routing bank messages, credit decisions, and Kubernetes issue classification, demonstrating higher accuracy and significantly lower cost and latency compared to large language models. It records precedents to improve over time and can scale to handle millions of decisions efficiently. Unlike language models, Ada does not generate text or handle novel decisions but excels in repeating established decisions quickly and reliably. Currently in beta, Glyphh plans to expand public benchmarks and develop models capable of answering multiple questions about a case simultaneously.
