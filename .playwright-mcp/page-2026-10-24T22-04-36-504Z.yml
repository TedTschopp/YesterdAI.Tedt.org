              - link "NBER study finds AI boosts junior patent attorneys' immediate drafting performance but only senior attorneys retain lasting skill gains ↗" [ref=e211] [cursor=pointer]:
                - /url: https://the-decoder.com/ai-makes-junior-patent-attorneys-instantly-better-but-may-quietly-stunt-their-professional-growth/
            - paragraph [ref=e212]: A three-month randomized controlled trial involving 133 patent attorneys across eleven U.S. intellectual property law firms found that AI assistance improved immediate patent drafting performance, especially for junior attorneys with less than seven years of experience. However, when AI was removed, only senior attorneys retained the benefits, suggesting that baseline expertise is necessary to convert AI-assisted work into durable professional skills. The study used an unreleased Google Labs AI assistant called InFlow and measured performance across drafting and redlining tasks. While juniors showed the largest gains during AI-assisted drafting, they did not improve in redlining tasks that require internalized judgment without AI. Researchers observed that senior attorneys restructured drafts based on legal principles, whereas juniors often identified flaws without fixing them, indicating a baseline skill gap that AI did not address. The findings highlight a tension between immediate productivity gains from AI and long-term skill development, which remains critical in professional settings where real-time judgment is required. The study's authors note limitations including sample size, firm representativeness, and the short duration relative to the years needed to build patent expertise, emphasizing the need for further research on AI's impact on professional growth.
