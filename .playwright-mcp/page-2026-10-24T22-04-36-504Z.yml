            - paragraph [ref=e124]: A recent study tested SpaceXAI's Grok 4.7 and OpenAI's GPT-6.1 Sol by asking each model to recommend a candidate in nearly 500 upcoming midterm election races. Grok recommended Republican candidates 92% of the time, while GPT favored Democrats 97% of the time, with the two models agreeing in fewer than 10% of cases. The study accessed the models via APIs, which differ from consumer chatbot apps that typically avoid direct candidate endorsements. Researchers noted that Grok often cited conservative sources and focused on topics like immigration and taxes, whereas GPT leaned on sources like Wikipedia and the Associated Press and emphasized healthcare and abortion. The study also found that both models showed biases aligned with their recommendations, sometimes ignoring candidates from the opposing party. OpenAI stated that their consumer app is designed to be politically neutral and that the API results do not reflect typical user interactions. The findings highlight potential hidden biases in AI models used for political information, which could influence users' perceptions during elections.
