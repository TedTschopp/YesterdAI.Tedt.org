              - link "Google DeepMind releases DetectorScope, an AI text detector that explains its predictions with interpretable features and localized evidence ↗" [ref=e90] [cursor=pointer]:
                - /url: https://github.com/google-deepmind/detectorscope
            - paragraph [ref=e91]: Google DeepMind has released DetectorScope, a tool that detects AI-generated text by breaking down its predictions into named, validated features with descriptions and locations in the text. This approach transforms black-box AI detectors into transparent systems that show which text properties influenced the AI classification and where they appear. DetectorScope uses sparse autoencoders on a language model's residual stream to generate interpretable features, each with a natural-language description and validation score. Users can adjust a threshold parameter to balance interpretability and accuracy, and the tool supports converting existing black-box detectors into auditable ones. DetectorScope maintains performance close to fine-tuned black-box classifiers while providing detailed explanations for its decisions. The tool is available via PyPI and GitHub, includes a demo on Hugging Face, and will be presented at EMNLP 2026 in Budapest. It aims to improve understanding and trust in AI text detection by making the detection process transparent and auditable.
            - time [ref=e92]: "Feed date: Oct 24, 2026 · 15:13 +0000"
