            - paragraph [ref=e135]: An analysis of AI model pricing from 2023 to 2026 confirms that the cost to achieve a given level of AI intelligence has decreased roughly tenfold every year, supporting predictions made by Sam Altman and Kai-Fu Lee. The study examined several benchmarks including Humanity's Last Exam, Arena Elo, GPQA Diamond, and Terminal-Bench, finding consistent cost reductions ranging from 10x every 0.8 to 1.3 years depending on the metric. This rapid decline in AI inference costs, dubbed "Lee's Law," outpaces Moore's Law and suggests AI capabilities are becoming increasingly affordable at an unprecedented rate.
